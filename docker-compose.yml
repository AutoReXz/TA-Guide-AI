services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      N8N_SECURE_COOKIE: "false"
      N8N_PROXY_HOPS: "1"
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n
  webhook-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WHATSAPP_TUNNEL_HOST: ${WHATSAPP_TUNNEL_HOST:-journal-nurses-adrian-item.trycloudflare.com}
      WHATSAPP_WEBHOOK_ID: ${WHATSAPP_WEBHOOK_ID:-2d33c8df-f64e-46c7-bac9-9c36f7c7b7ae}
    ports:
      - "127.0.0.1:5678:8080"
    volumes:
      - ./n8n/Caddyfile:/etc/caddy/Caddyfile:ro
volumes:
  n8n_data:
